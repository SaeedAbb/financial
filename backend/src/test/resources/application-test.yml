spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS basis
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: basis
    show-sql: true
  
  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.basis: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# Disable OAuth2 security for tests
spring.security.oauth2.resourceserver.jwt.enabled: false