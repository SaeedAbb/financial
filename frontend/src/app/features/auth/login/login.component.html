<div class="auth-container">
  <div class="auth-content">
    <!-- Header -->
    <div class="auth-header">
      <div class="brand-section">
        <h1 class="text-4xl font-bold text-white mb-2">Welcome Back</h1>
        <p class="text-lg text-white opacity-90">Sign in to your Basis Project account</p>
      </div>
      
      <div class="navigation-links">
        <a routerLink="/auth" class="back-link">
          <i class="pi pi-arrow-left mr-2"></i>
          Back to Home
        </a>
      </div>
    </div>

    <!-- Login Card -->
    <p-card class="auth-card">
      <ng-template pTemplate="header">
        <div class="card-header">
          <h2 class="text-2xl font-semibold mb-1">Sign In</h2>
          <p class="text-600">Enter your credentials to access your account</p>
        </div>
      </ng-template>

      <!-- Error Message -->
      <p-message 
        *ngIf="errorMessage" 
        severity="error" 
        [text]="errorMessage"
        class="w-full mb-4">
      </p-message>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <!-- Email Field -->
        <div class="field">
          <label for="email" class="block text-900 font-medium mb-2">Email Address</label>
          <input 
            pInputText 
            id="email" 
            type="email"
            formControlName="email"
            placeholder="Enter your email address"
            class="w-full"
            [class.ng-invalid]="hasFieldError('email')"
            [class.ng-dirty]="hasFieldError('email')">
          <small *ngIf="hasFieldError('email')" class="p-error block mt-1">
            {{ getFieldError('email') }}
          </small>
        </div>

        <!-- Password Field -->
        <div class="field">
          <label for="password" class="block text-900 font-medium mb-2">Password</label>
          <p-password 
            formControlName="password"
            inputId="password"
            placeholder="Enter your password"
            styleClass="w-full"
            inputStyleClass="w-full"
            [toggleMask]="true"
            [feedback]="false">
          </p-password>
          <small *ngIf="hasFieldError('password')" class="p-error block mt-1">
            {{ getFieldError('password') }}
          </small>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex align-items-center justify-content-between mb-4">
          <div class="flex align-items-center">
            <p-checkbox 
              formControlName="rememberMe" 
              inputId="rememberMe"
              binary="true">
            </p-checkbox>
            <label for="rememberMe" class="ml-2 text-900">Remember me</label>
          </div>
          <a href="#" class="text-primary no-underline text-sm">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <p-button 
          type="submit"
          label="Sign In" 
          icon="pi pi-sign-in"
          class="w-full mb-3"
          size="large"
          [loading]="isLoading"
          [disabled]="!loginForm.valid">
        </p-button>

        <!-- Divider -->
        <p-divider align="center" type="solid" class="my-4">
          <b class="text-500">or</b>
        </p-divider>

        <!-- Social Login -->
        <p-button 
          type="button"
          label="Continue with Google" 
          icon="pi pi-google"
          class="w-full"
          size="large"
          severity="secondary"
          (click)="loginWithGoogle()">
        </p-button>
      </form>

      <ng-template pTemplate="footer">
        <div class="card-footer">
          <p class="text-center text-600 m-0">
            Don't have an account? 
            <a routerLink="/auth/register" class="text-primary no-underline font-medium">Sign up here</a>
          </p>
        </div>
      </ng-template>
    </p-card>

    <!-- Footer -->
    <div class="auth-footer">
      <p class="text-sm text-white opacity-75 text-center">
        Built with Spring Boot, Angular & PrimeNG | 
        <a href="https://github.com" target="_blank" class="text-white no-underline">
          <i class="pi pi-github"></i> View on GitHub
        </a>
      </p>
    </div>
  </div>
</div>
