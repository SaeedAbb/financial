version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: financial-postgres
    environment:
      POSTGRES_DB: financial_db
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Backend
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: financial-backend
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: financial_db
      DB_USERNAME: financial_user
      DB_PASSWORD: financial_password
      
      # Server Configuration
      SERVER_PORT: 8080
      
      # JVM Configuration
      JAVA_OPTS: "-Xmx512m -Xms256m"
      
      # Spring Profiles
      SPRING_PROFILES_ACTIVE: docker
      
      # Keycloak Configuration
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/financial-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/financial-realm/protocol/openid-connect/certs
      KEYCLOAK_REALM: financial-realm
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: http://localhost,http://frontend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - financial-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    volumes:
      - backend_logs:/app/logs

  # Angular Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: financial-frontend
    environment:
      # Frontend Configuration
      API_URL: http://backend:8080/api/v1
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: financial-realm
      KEYCLOAK_CLIENT_ID: financial-frontend
      APP_URL: http://localhost
      SWAGGER_URL: http://backend:8080/swagger-ui.html
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - financial-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Keycloak Authentication Server
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: financial-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # SMTP Configuration
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@financial.com
      SMTP_SSL: "false"
      SMTP_STARTTLS: "false"
      SMTP_AUTH: "false"
    command:
      - start-dev
      - --import-realm
    ports:
      - "8180:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - financial-network
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes:/opt/keycloak/themes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Keycloak Database
  keycloak-postgres:
    image: postgres:15-alpine
    container_name: financial-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - financial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Mailhog - Email testing service
  mailhog:
    image: mailhog/mailhog:latest
    container_name: financial-mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - financial-network
    restart: unless-stopped

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financial-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@financial.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - financial-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  backend_logs:
    driver: local
  keycloak_postgres_data:
    driver: local

networks:
  financial-network:
    driver: bridge